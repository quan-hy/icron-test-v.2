name: Forecast ingest

on:
  schedule:
    - cron: '33 5,11,17,23 * * *'
  workflow_dispatch:
    inputs:
      model_cycle:
        description: 'UTC cycle YYYYMMDDHH; blank selects an available candidate'
        required: false
        type: string
      sst_date:
        description: 'RTG date YYYYMMDD; blank selects yesterday UTC'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: forecast-ingest
  cancel-in-progress: false

jobs:
  ingest:
    if: vars.COLLECTION_ENABLED == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check configuration
        env:
          INGEST_URL: ${{ secrets.INGEST_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
        run: |
          if [[ -z "$INGEST_URL" || -z "$INGEST_TOKEN" ]]; then
            echo '::error::Collection credentials are required.'
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Collect forecasts
        env:
          INGEST_URL: ${{ secrets.INGEST_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          INPUT_MODEL_CYCLE: ${{ inputs.model_cycle }}
          INPUT_SST_DATE: ${{ inputs.sst_date }}
        run: python run_scheduled.py forecast
      - name: Collect mapped tide predictions
        if: always() && vars.TIDES_ENABLED == '1'
        env:
          INGEST_URL: ${{ secrets.INGEST_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          TIDE_MAPPINGS: ${{ secrets.TIDE_MAPPINGS }}
        run: python run_scheduled.py tides
