name: Weekly content candidates

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: content-discovery
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
      - name: Collect official links and licensed photo candidates
        run: node --experimental-strip-types tools/content/collect.ts --execute --output "$RUNNER_TEMP/ivysurf-candidates"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regional-candidates-${{ github.run_id }}
          path: ${{ runner.temp }}/ivysurf-candidates/
          retention-days: 14
          if-no-files-found: error
